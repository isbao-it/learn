# ===== 阶段8学习：一键启动配置 =====
services:
  api:
    build: .                 # 用当前目录的 Dockerfile 构建镜像
    container_name: baokuan-api
    ports:
      - "8000:8000"          # 宿主机8000 → 容器8000
    env_file:
      - .env                 # 注入 DeepSeek key（容器里也能读到）
    restart: unless-stopped  # 挂了自动重启（服务器标配）
